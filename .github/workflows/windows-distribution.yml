name: Windows distribution

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run source tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: python -m unittest discover -s tests -v

      - name: Build Player and Developer distributions
        run: python tools/build/build.py --clean --targets all

      - name: Smoke-test built executables
        run: python tools/build/test_distribution.py --targets all

      - name: Upload Windows distributions
        uses: actions/upload-artifact@v4
        with:
          name: kadoka-quest-windows
          path: dist/
          if-no-files-found: error
