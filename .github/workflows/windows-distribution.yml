name: Windows distribution

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run source tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: python -m unittest discover -s tests -v

      - name: Build Player and Developer distributions
        run: python tools/build/build.py --clean --targets all

      - name: Smoke-test built executables
        run: python tools/build/test_distribution.py --targets all

      - name: Developer validates Player project
        shell: pwsh
        run: |
          $root = "dist/KadokaQuestDeveloper"
          $exe = "$root/KadokaQuestDeveloper.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--validate-project" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Get-Content "$root/UserData/developer/project-validation.log" -ErrorAction SilentlyContinue
            exit $process.ExitCode
          }

      - name: Developer builds Player distribution
        shell: pwsh
        run: |
          $root = "dist/KadokaQuestDeveloper"
          $exe = "$root/KadokaQuestDeveloper.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--build-player" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Get-Content "$root/UserData/developer/player-build.log" -ErrorAction SilentlyContinue
            exit $process.ExitCode
          }
          if (-not (Test-Path "$root/dist/KadokaQuest/KadokaQuest.exe")) {
            Write-Error "Developer build did not create KadokaQuest.exe"
            exit 1
          }

      - name: Developer smoke-tests generated Player
        shell: pwsh
        run: |
          $root = "dist/KadokaQuestDeveloper"
          $exe = "$root/KadokaQuestDeveloper.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-player-build" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Get-Content "$root/UserData/developer/player-smoke.log" -ErrorAction SilentlyContinue
            exit $process.ExitCode
          }

      - name: Clean Developer self-test output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "dist/KadokaQuestDeveloper/dist" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "dist/KadokaQuestDeveloper/UserData/developer" -ErrorAction SilentlyContinue

      - name: Upload Windows distributions
        uses: actions/upload-artifact@v4
        with:
          name: kadoka-quest-windows
          path: dist/
          if-no-files-found: error
