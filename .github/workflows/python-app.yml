# {
#   責務: [python-app: Pythonの品質・構造・パッケージをCIで検証する]
#   フィールド: [jobs: Pythonテスト・固定版Godotでのテスト/E2E・project/package integrityの検証ジョブ。ローカルではtools/local-ci/script/run_local_ci.pyが同じコマンドを実行します]
# }
name: Python quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . flake8 pytest -r tools/format/requirements.txt
          python -m pip check

      - name: Lint for syntax and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Report non-blocking style findings
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: python -m pytest

  godot:
    name: Test Godot port and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      GODOT_VERSION: 4.7.2-stable
      # 公式リリースのSHA512-SUMS.txtにあるLinux版の値です。版を上げるときは値も更新してください。
      GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
      # Godotが見つからない、またはGodotを理由にskipされたテストがある場合は失敗にします。
      KADOKA_REQUIRE_GODOT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check

      - name: Install pinned Godot
        run: |
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --output "$RUNNER_TEMP/$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${archive}"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/$archive" | sha512sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          executable="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$executable"
          "$executable" --headless --version
          echo "KADOKA_GODOT_EXECUTABLE=$executable" >> "$GITHUB_ENV"

      - name: Import Godot resources
        run: '"$KADOKA_GODOT_EXECUTABLE" --headless --path gdscript --editor --import --quit'

      - name: Run Godot tests and E2E
        run: python -m pytest -m godot

  project-integrity:
    name: Validate game data and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          # 整形確認は比較元ブランチとの差分で追加ファイルを選ぶため、比較元の履歴も取得します。
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check formatting of added Python files
        run: |
          python -m pip install -r tools/format/requirements.txt
          python tools/format/script/format_changed.py --check

      - name: Install latest architecture checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade --force-reinstall -r tools/upd-commander/requirements.txt

      - name: Check architecture rules and generated docs
        run: |
          python tools/project-integrity/script/check_project_rules.py
          python tools/comment-check/script/check_comments.py
          python tools/code-docs/script/generate_repo_map.py --check
          python tools/upd-commander/script/check.py
          python tools/code-docs/script/generate_class_diagram.py --source src/kadoka_quest/application --output docs/generated/application_class_diagram.mmd --check

      - name: Install project
        run: |
          python -m pip install .
          python -m pip check

      - name: Check runtime routing performance
        run: python tools/performance-check/script/check_runtime_performance.py

      - name: Validate canonical Player project
        run: python developer_launcher.py --validate-project

  package-integrity:
    name: Build and install Python package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel into an isolated environment
        run: |
          python -m venv .package-venv
          .package-venv/bin/python -m pip install --upgrade pip
          .package-venv/bin/python -m pip install dist/*.whl
          .package-venv/bin/python -m pip check

      - name: Import installed package outside repository
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.package-venv/bin/python" -c "import kadoka_quest; print(kadoka_quest.__file__)"
