[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kadoka-quest"
version = "0.1.0"
description = "JSON-driven 2D open-world monster RPG prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5,<3"]

[project.scripts]
kadoka-quest = "kadoka_quest.apps.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


